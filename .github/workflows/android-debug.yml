
name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK file not found!"
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK file is empty!"
            exit 1
          fi

          echo "Checking APK integrity..."
          unzip -t "$APK"

          echo "APK verification successful!"

      - name: Prepare APK artifact
        run: |
          mkdir -p artifacts

          cp app/build/outputs/apk/debug/app-debug.apk \
            artifacts/Easy-Speaking-Debug.apk

          cd artifacts
          sha256sum Easy-Speaking-Debug.apk > SHA256SUMS.txt

          ls -lh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Easy-Speaking-Debug-APK
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          
